[package]
name = "bobot"
version = "0.1.0"
edition = "2024"

[lib]

[[bin]]
name = "webface"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
axum = "0.8.9"
bit-iter = "1.3.1"
bytemuck = "1.25.2"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
wide = "1.6.1"

[dev-dependencies]
itertools = "0.15.0"
proptest = { version = "1.11.0", features = ["attr-macro"] }
