[package]
name = "bobot"
version = "0.1.0"
edition = "2024"

[lib]

[[bin]]
name = "webface"

[[bench]]
name = "bitboard"
harness = false

[profile.release]
lto = true
codegen-units = 1

[dependencies]
bit-iter = "1.3.1"
bytemuck = "1.25.2"
rand = "0.10.2"
wide = "1.6.1"

# For webface
axum = { version = "0.8.9", features = ["macros"] }
dashmap = "6.2.1"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
bitintr = "0.3.0"

[dev-dependencies]
criterion = "0.8.2"
itertools = "0.15.0"
proptest = { version = "1.11.0", features = ["attr-macro"] }
rapidrand = "0.1.2"
